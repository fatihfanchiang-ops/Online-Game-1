<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LTBrown Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* 登录页面样式 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2c3e50;
            flex-direction: column;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        /* 商店页面样式 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px 0;
            text-align: center;
        }

        .cart-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .total {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .checkout-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .products h2 {
            margin-bottom: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .product-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 0 auto 10px;
        }

        .order-status {
            background: #f1f1f1;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .delivery-tracker {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .step {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 5px;
            width: 23%;
        }

        .step.active {
            background: #27ae60;
            color: white;
        }

        /* 隐藏商店 */
        #store {
            display: none;
        }
    </style>
</head>
<body>

<!-- 登录界面 -->
<div id="login" class="login-container">
    <div class="login-box">
        <h2>Store Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="login()">Login</button>
    </div>
</div>

<!-- 商店页面（默认隐藏） -->
<div id="store">
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-store"></i> LTBrown Community Store</h1>
            <p>Fast Delivery for Our Community</p>
        </div>
    </header>

    <section class="cart-section">
        <div class="container">
            <h2>Your Cart <span id="cart-count">0</span></h2>
            <div id="cart-items" class="cart-items"></div>
            <p class="total">Total: NT$<span id="total-price">0.00</span></p>
            <button id="checkout-btn" class="checkout-btn">Place Order & Request Delivery</button>
        </div>
    </section>

    <main class="products">
        <div class="container">
            <h2>Community Products</h2>
            <div class="product-grid" id="product-grid"></div>
        </div>
    </main>

    <section class="order-status" id="order-status" style="display: none;">
        <div class="container">
            <h2>Order & Delivery Status</h2>
            <div id="status-message"></div>
            <div class="delivery-tracker">
                <div class="step" id="step1"><i class="fas fa-check"></i> Order Placed</div>
                <div class="step" id="step2">Preparing</div>
                <div class="step" id="step3">Out for Delivery</div>
                <div class="step" id="step4">Delivered</div>
            </div>
        </div>
    </section>
</div>

<script>
    // 登录功能：随便输入都能进
    function login() {
        document.getElementById("login").style.display = "none";
        document.getElementById("store").style.display = "block";
    }

    // 商品数据
    const products = [
        { id: 1, name: "可乐", price: 100, image: "https://nimg.ws.126.net/?url=http%3A%2F%2Fdingyue.ws.126.net%2F2026%2F0430%2F39754390j00teb1870063d000u0018zm.jpg&thumbnail=660x2147483647&quality=80&type=jpg" },
        { id: 2, name: "橙子", price: 200, image: "https://img2.baidu.com/it/u=2390670,1882300917&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=644" },
        { id: 3, name: "农夫山泉", price: 30, image: "https://img2.baidu.com/it/u=858356215,3685209921&fm=253&app=138&f=JPEG?w=800&h=1422" }
    ];

    let cart = [];
    let total = 0;

    function renderProducts() {
        const grid = document.getElementById('product-grid');
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" class="product-img" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>NT$${product.price.toFixed(2)}</p>
                <button onclick="addToCart(${product.id})">Add to Cart</button>
            `;
            grid.appendChild(card);
        });
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        cart.push(product);
        total += product.price;
        updateCart();
    }

    function updateCart() {
        document.getElementById('cart-count').textContent = cart.length;
        document.getElementById('total-price').textContent = total.toFixed(2);
        const items = document.getElementById('cart-items');
        items.innerHTML = '';
        cart.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.textContent = `${item.name} - NT$${item.price.toFixed(2)}`;
            items.appendChild(div);
        });
    }

    document.getElementById('checkout-btn').addEventListener('click', () => {
        if (cart.length === 0) { alert("Your cart is empty!"); return; }
        document.getElementById('order-status').style.display = 'block';
        ['step1','step2','step3','step4'].forEach((s,i)=>{
            setTimeout(()=>document.getElementById(s).classList.add('active'),i*1500);
        });
    });

    window.onload = renderProducts;
</script>
</body>
</html>
